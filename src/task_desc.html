<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./scripts.js"></script>
</head>
<body>
    <main class="container py-4">
        <div class="mx-auto todo-wrap">
    <h1>Task Details</h1>
        <p><strong>ID:</strong> <span id="task-id"></span></p>
        <p><strong>Title:</strong> <span id="task-text"></span></p>
        <br>
        <div class="accordion" id="task-details-accordion">
            <div class="accordion-item">
                <h2 class="accordion-header" id="heading-description">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-description" aria-expanded="true" aria-controls="collapse-description">
                        Description
                    </button>
                </h2>
                <div id="collapse-description" class="accordion-collapse collapse show" aria-labelledby="heading-description" data-bs-parent="#task-details-accordion">
                    <div class="accordion-body">
                        <p id="task-description"></p>
                    </div>
                </div>
            </div>
        <br>
        <p><strong>Done?:</strong> <span id="task-done"></span></p>
        <p><strong>Created at:</strong> <span id="task-created-at"></span></p>
        </div>
        <br>
        <br>
        <br>
        <h2>Edit Task</h2>
        <br>
        <form class="row g-2 mb-3">
            <input class="form-control" type="text" id="task-description-input" placeholder="Edit Description">
            <button id="update-description" class="btn btn-info btn-sm">Update</button>
        </form>
        <br>
        <form class="row g-2 mb-3">
            <input class="form-control" type="text" id="task-title-input" placeholder="Edit Title">
            <button id="update-title" class="btn btn-info btn-sm">Update</button>
        </form>
    </main>

        <script>
            const params = new URLSearchParams(window.location.search);
            document.getElementById('task-id').textContent = params.get('taskId') || '';
            document.getElementById('task-text').textContent = params.get('taskText') || '';
            if (params.get('taskDone') === 'true') {
                document.getElementById('task-done').textContent = 'yes';
            } else {
                document.getElementById('task-done').textContent = 'no';
            };
            document.getElementById('task-created-at').textContent = new Date(params.get('taskCreatedAt')).toLocaleString();
            document.getElementById('update-title').addEventListener('click', (event) => {
                event.preventDefault();
                const newTitle = document.getElementById('task-title-input').value;
                const taskId = params.get('taskId');
                updateTaskTitle(taskId, newTitle);
                document.getElementById('task-text').textContent = newTitle;
                window.api.refreshTaskList();
            });
            document.getElementById('task-description').textContent = params.get('taskDescription') || '';
            document.getElementById('update-description').addEventListener('click', (event) => {
                event.preventDefault();
                const newDescription = document.getElementById('task-description-input').value;
                const taskId = params.get('taskId');
                updateTaskDescription(taskId, newDescription);
                document.getElementById('task-description').textContent = newDescription;
                window.api.refreshTaskList();
            });
        </script>
</body>
</html>

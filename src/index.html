<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToDo app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="container py-4">
      <div class="mx-auto todo-wrap">
        <h1 class="h3 mb-3">ToDo app</h1>

        <form class="row g-2 mb-3">
          <div class="col-12 col-md-8">
            <input type="text" class="form-control" id="task-input" placeholder="Add a new task" />
          </div>
          <div class="col-12 col-md-4 d-grid">
            <button id="submit_task" class="btn btn-primary" type="submit">Add</button>
          </div>
        </form>

        <div class="d-flex gap-2 mb-3">
          <button id="export_tasks" class="btn btn-outline-primary" type="button" onclick="exportTasks()">Export</button>
          <button id="import_tasks" class="btn btn-outline-secondary" type="button" onclick="importTasks()">Import</button>
        </div>

        <ul id="task-list" class="list-group"></ul>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./scripts.js"></script>
    <script>
      showTasks();
      const form = document.querySelector('form');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        await saveTask(document.getElementById('task-input').value);
        document.getElementById('task-input').value = '';
        showTasks();
      });
      if (window.api && typeof window.api.onRefreshTaskList === 'function') {
        window.api.onRefreshTaskList(() => {
        showTasks();
      });
      }

    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World!</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1>ToDo app</h1>
    <form>
      <input type="text" id="task-input" placeholder="Add a new task" />
      <button id="submit_task" type="submit">Add</button>
    </form>
    <ul></ul>  
    <script src="./scripts.js"></script>
    <script>
      showTasks();
      const button = document.getElementById("submit_task");
      button.addEventListener("click", () => saveTask(document.getElementById("task-input").value));
      button.addEventListener("click", showTasks);
    </script>
  </body>
</html>
